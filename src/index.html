<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Honeymoon Journey</title>
  <!-- Favicon & iOS Web App -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/weiyuan1993/honeymoon-journal/main/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/weiyuan1993/honeymoon-journal/main/assets/images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="蜜月旅行">
  <meta name="theme-color" content="#fdfbf7">
  <!-- Preconnect for faster Google Fonts loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <div id="root">
    <!-- Initial loading state before React mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fdfbf7; font-family: 'Lora', Georgia, serif;">
      <div style="width: 40px; height: 40px; border: 3px solid #e6d5b8; border-top-color: #c5a059; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 16px; color: #c5a059; font-size: 14px; letter-spacing: 2px;">Loading...</p>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
